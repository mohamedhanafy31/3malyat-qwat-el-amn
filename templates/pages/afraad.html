{% extends "base.html" %}
{% block export %}xlsx print docx{% endblock %}

{% block content %}
<div class="panel">
  <div class="toolbar" id="afBar">
    <div class="tb-group" role="group" aria-label="التنقل بين الأيام">
      <button class="mini" id="dayPrev">{{ icon('chevron-prev') }} السابق</button>
      <input type="date" id="dutyDate" class="select">
      <button class="mini" id="dayNext">التالي {{ icon('chevron-next') }}</button>
      <button class="mini day-jump" id="dayToday">اليوم</button>
    </div>
    <div class="tb-group" role="group" aria-label="حالة اليوم"><span id="dayLockBadge">{{ skeleton("status") }}</span></div>
  </div>
  <div id="afWrap">{{ skeleton("rows", 10) }}</div>
</div>
{% endblock %}

{% block modals %}{% include "partials/afraad_entry_modal.html" %}{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/afraad.js') }}"></script>
{% endblock %}
