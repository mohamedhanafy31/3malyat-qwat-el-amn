{% extends "base.html" %}
{% block export %}xlsx print{% endblock %}

{% block content %}
<div class="panel">
  <div class="toolbar" id="dutyBar">
    <div class="tb-group" role="group" aria-label="التنقل بين الأيام">
      <button class="mini" id="dayPrev">{{ icon('chevron-prev') }} السابق</button>
      <input type="date" id="dutyDate" class="select">
      <button class="mini" id="dayNext">التالي {{ icon('chevron-next') }}</button>
      <button class="mini" id="dayToday">النهاردة</button>
    </div>
    <div class="tb-group tb-end"><span id="balanceTag"></span></div>
  </div>
  <div id="restStrip"></div>
  <div id="dutySummary"></div>
  <div id="dutyBoard"></div>
</div>
{% endblock %}

{% block modals %}
{% include "partials/assign_modal.html" %}
{% include "partials/stop_leave_modal.html" %}
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/rest-stop.js') }}"></script>
<script src="{{ url_for('static', filename='js/duty.js') }}"></script>
{% endblock %}
