{% extends "base.html" %}
{% block export %}xlsx print{% endblock %}

{% block content %}
<div class="panel">
  <div class="ls-filter-bar">
    <div class="ls-filter-title">
      {{ icon('users') }}
      <span>الضابط:</span>
    </div>
    <div class="ls-filter-group">
      <select id="ologOfficer" class="select select-officer" aria-label="اختيار الضابط">
        <option value="">— اختَر ضابط —</option>
      </select>
    </div>

    <div class="ls-filter-range" role="group" aria-label="مدى التاريخ">
      <div class="ls-filter-title">
        {{ icon('filter') }}
        <span>مدى التاريخ:</span>
      </div>
      <div class="ls-filter-group">
        <label for="ologFrom">من:</label>
        <input type="date" id="ologFrom" class="select select-sm">
      </div>
      <div class="ls-filter-group">
        <label for="ologTo">إلى:</label>
        <input type="date" id="ologTo" class="select select-sm">
      </div>
    </div>
    <div class="ls-filter-quick">
      <button type="button" class="btn btn-xs" id="ologPreset7">آخر 7 أيام</button>
      <button type="button" class="btn btn-xs" id="ologPreset30">آخر 30 يوم</button>
      <button type="button" class="btn btn-xs" id="ologPresetMonth">الشهر ده</button>
    </div>
    <button type="button" class="btn btn-xs btn-outline" id="ologSortToggle">الأقدم أولًا ↓</button>
  </div>

  <div id="ologWrap"></div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/officer-log.js') }}"></script>
{% endblock %}
