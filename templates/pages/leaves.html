{% extends "base.html" %}

{% block content %}
<div class="stats" id="leaveStats"></div>

<div class="panel">
  <div class="panel-head">
    <div class="tabs">
      <button class="tab active" data-lv="all">الكل</button>
      <button class="tab" data-lv="current">جارية الآن</button>
      <button class="tab" data-lv="upcoming">قادمة</button>
      <button class="tab" data-lv="month">هذا الشهر</button>
    </div>
  </div>
  <div class="toolbar">
    <input id="leaveSearch" class="search" placeholder="بحث باسم الشخص أو الملاحظات...">
    <select id="leaveTypeFilter" class="select"></select>
    <select id="leaveMonthFilter" class="select"></select>
    <select id="leaveCategoryFilter" class="select">
      <option value="">جميع الفئات</option>
      <option value="officers">ضباط</option>
      <option value="personnel">صف ضباط / أفراد</option>
    </select>
    <select id="leaveDurationFilter" class="select">
      <option value="">جميع المدد</option>
      <option value="short">قصيرة (1-3 أيام)</option>
      <option value="medium">متوسطة (4-7 أيام)</option>
      <option value="long">طويلة (أكثر من 7 أيام)</option>
    </select>
    <button class="primary" id="addLeaveBtn">＋ تسجيل راحة</button>
  </div>
  <div id="leaveWrap"></div>
</div>
{% endblock %}


{% block modals %}{% include "partials/leave_modal.html" %}{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/leave-form.js') }}"></script>
<script src="{{ url_for('static', filename='js/leaves.js') }}"></script>
{% endblock %}
