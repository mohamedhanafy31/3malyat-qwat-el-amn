<!-- ============ عرض موقع خدمة (نافذة منبثقة للعرض بس) ============ -->
<div class="modal hidden" id="locationModal">
  <div class="modal-card">
    <button class="close" data-close="locationModal">×</button>
    <h2 id="locationModalTitle">موقع الخدمة</h2>
    <p id="locationModalText" class="hint"></p>
    <div id="locationModalGallery" class="location-gallery"></div>
  </div>
</div>

<!-- ============ تكبير صورة الموقع (فوق نافذة الموقع) ============ -->
<div class="modal hidden" id="locationZoomModal">
  <div class="modal-card small location-zoom-card">
    <button class="close" data-close="locationZoomModal">×</button>
    <img id="locationZoomImg" src="" alt="">
  </div>
</div>
