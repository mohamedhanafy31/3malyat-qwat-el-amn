<!-- ============ خانة في اليومية التفصيلية ============ -->
<div class="modal hidden" id="entryModal">
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="entryTitle">
    <button type="button" class="close" data-close="entryModal" aria-label="إغلاق">×</button>
    <h2 id="entryTitle">إضافة خانة</h2>
    <form id="entryForm" novalidate>
      <input type="hidden" id="enId">
      <p class="form-note">الحقول المعلّمة بـ <span class="req" aria-hidden="true">*</span> مطلوبة</p>

      <div class="field-section">
        <div class="field-legend">الخدمة</div>
        <div class="grid">
          <label><span class="label-text">اسم الخدمة <span class="req" aria-hidden="true">*</span></span>
            <input id="enName" required maxlength="120" placeholder="اكتب اسم الخدمة">
          </label>
          <label><span class="label-text">التصنيف <span class="req" aria-hidden="true">*</span></span> <small>تظهر خانته في جدول الإجمالي</small>
            <select id="enKind" required></select>
          </label>
          <label>القسم على اللوحة <small>اختر قسمًا مستخدمًا من قبل، أو اكتب اسم قسم جديد</small>
            <select id="enSection" data-combo-custom data-maxlength="60" aria-label="القسم على اللوحة"></select>
          </label>
          <fieldset id="enShiftWrap" class="seg-field">
            <legend>الفترة</legend>
            <div class="seg-toggle" id="enShift"></div>
          </fieldset>
          <label class="command-check mission-transport-pick" id="enMissionTransportPick">
            <input type="checkbox" id="enMissionTransport">
            <span class="command-check-icon" aria-hidden="true">{{ icon('check') }}</span>
            <span>مأمورية / ترحيلة
              <small>تُضاف تلقائيًا إلى صفحة المأموريات والتراحيل في هذا اليوم. داخلية = تديرها الإدارة بالكامل (شئون المجندين، تبة ضرب النار)، خارجية = تديرها جهة أخرى (تراحيل، حملة الأمن الوطني)</small>
            </span>
          </label>
          <div id="enSectionHistory" class="section-history hidden" aria-live="polite"></div>
        </div>
      </div>

      <details class="field-section entry-sec" data-entry-sec="people">
        <summary class="field-legend">الأفراد <span class="entry-sec-sum" data-entry-sum="people"></span></summary>
        <small class="form-note">يمكن إبقاء الخانة دون ضابط — خدمة بقوام أفراد ومجندين فقط</small>
        <div class="command-picks">
          <label class="command-check" id="enHasOfficersPick">
            <input type="checkbox" id="enHasOfficers">
            <span class="command-check-icon" aria-hidden="true">{{ icon('check') }}</span>
            رئاسة ضابط
          </label>
          <label class="command-check" id="enHasPersonnelPick">
            <input type="checkbox" id="enHasPersonnel">
            <span class="command-check-icon" aria-hidden="true">{{ icon('check') }}</span>
            رئاسة فرد
          </label>
        </div>
        <div class="grid">
          <label id="enOfficersWrap" class="hidden">الضباط <small>واحد أو أكثر</small>
            <select id="enOfficers" multiple size="4"></select>
          </label>
          <label id="enPersonnelWrap" class="hidden">الأفراد <small>واحد أو أكثر</small>
            <select id="enPersonnel" multiple size="4"></select>
          </label>
        </div>
        <small class="form-note">يمكن حفظ «رئاسة ضابط» أو «رئاسة فرد» بدون اختيار اسم الآن؛ ستظهر الرئاسة شاغرة لحين التعيين.</small>
      </details>

      <details class="field-section entry-sec" data-entry-sec="conscripts">
        <summary class="field-legend">المجندون <span class="entry-sec-sum" data-entry-sum="conscripts"></span></summary>
        <div id="conRows" class="req-rows"></div>
        <button type="button" class="mini" id="addConRow">{{ icon('plus') }} إضافة فئة</button>
        <label class="field-label-spaced">عدد المجندين
          <small>لأي خدمة غير أساسية (طارئة أو قسم مخصّص) — يظهر في صفحة أعداد الخدمات تلقائيًا</small>
          <input id="enConCount" type="number" min="0" max="9999" step="1">
        </label>
      </details>

      <details class="field-section entry-sec" data-entry-sec="details">
        <summary class="field-legend">تفاصيل الخدمة <span class="entry-sec-sum" data-entry-sum="details"></span></summary>
        <div class="grid">
          <label>التسليح <small>آلي / دونك / خرطوش / فض / فيدرال / كلبش</small>
            <input id="enWeapon" maxlength="120">
          </label>
          <label>الانتظام <small>اختَر معاد الانتظام من لوحة الساعة</small>
            <input id="enTime" data-time maxlength="60" aria-describedby="enTimeLegacy">
            <small id="enTimeLegacy" class="time-legacy hidden"></small>
          </label>
          <label>الجهة <small>عتاقة / الجناين / فيصل / الأربعين</small>
            <input id="enParty" maxlength="120">
          </label>
        </div>
      </details>

      <details class="field-section entry-sec" data-entry-sec="notes">
        <summary class="field-legend">ملاحظات <span class="entry-sec-sum" data-entry-sum="notes"></span></summary>
        <label><span class="sr-only">ملاحظات</span>
          <input id="enNote" maxlength="500" aria-label="ملاحظات">
        </label>
      </details>
      <span class="shortcut-save-hint"><kbd>Ctrl</kbd> + <kbd>Enter</kbd> للحفظ</span>
      <div class="actions modal-foot">
        <button class="primary full" type="submit">حفظ</button>
        <button type="button" class="btn" data-close="entryModal">إلغاء</button>
      </div>
    </form>
  </div>
</div>
