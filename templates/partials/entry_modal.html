<!-- ============ خانة في لوحة التشغيل المختصرة ============ -->
<div class="modal hidden" id="entryModal">
  <div class="modal-card">
    <button class="close" data-close="entryModal">×</button>
    <h2 id="entryTitle">إضافة خانة</h2>
    <form id="entryForm">
      <input type="hidden" id="enId">

      <div class="field-section">
        <div class="field-legend">بيانات الخدمة</div>
        <div class="grid">
          <label>التصنيف <small>اختر أو اكتب تصنيف جديد</small>
            <input id="enCategory" list="categoryList" required>
            <datalist id="categoryList"></datalist>
          </label>
          <label>اسم الخدمة
            <input id="enService" required>
          </label>
          <label id="enShiftWrap">الفترة
            <select id="enShift"><option value="">— بدون —</option></select>
          </label>
          <label>الضابط <small>اختياري</small>
            <input id="enOfficer" list="officerList" placeholder="اختر من القوة أو اكتب اسم">
            <datalist id="officerList"></datalist>
          </label>
        </div>
      </div>

      <div class="field-section">
        <div class="field-legend">الاحتياجات <small>ضابط / فرد / مج / وحدة / أي حاجة تانية بمزاجك</small></div>
        <div id="reqRows" class="req-rows"></div>
        <button type="button" class="mini" id="addReqRow">＋ إضافة احتياج</button>
      </div>

      <div class="field-section">
        <div class="field-legend">الوسوم <small>مباراة، خطة انتشار... اكتب واحد جديد لو مش موجود</small></div>
        <input id="enTags" list="tagList" placeholder="اكتب وسم واضغط Enter">
        <datalist id="tagList"></datalist>
        <div id="tagChips" class="tag-chips"></div>
      </div>

      <label>ملاحظات
        <input id="enNote">
      </label>
      <div class="actions" style="margin-top:10px">
        <button class="primary full" type="submit">حفظ</button>
      </div>
    </form>
  </div>
</div>
