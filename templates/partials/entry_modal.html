<!-- ============ خانة في اليومية التفصيلية ============ -->
<div class="modal hidden" id="entryModal">
  <div class="modal-card">
    <button class="close" data-close="entryModal">×</button>
    <h2 id="entryTitle">إضافة خانة</h2>
    <form id="entryForm">
      <input type="hidden" id="enId">

      <div class="field-section">
        <div class="field-legend">الخدمة</div>
        <div class="grid">
          <label>اسم الخدمة
            <input id="enName" required placeholder="اكتب اسم الخدمة">
          </label>
          <label>التصنيف <small>خانتها في جدول الإجمالي</small>
            <select id="enKind" required></select>
          </label>
          <label>القسم على اللوحة <small>اختار قسم مستخدم قبل كده، أو اكتب اسم قسم جديد</small>
            <select id="enSection" data-combo-custom aria-label="القسم على اللوحة"></select>
          </label>
          <fieldset id="enShiftWrap" class="seg-field">
            <legend>الفترة</legend>
            <div class="seg-toggle" id="enShift"></div>
          </fieldset>
          <div id="enSectionHistory" class="section-history hidden" aria-live="polite"></div>
        </div>
      </div>

      <div class="field-section">
        <div class="field-legend">القوام
          <small>الخانة تنفع تفضل من غير ضابط — خدمة بقوام أفراد ومجندين بس</small></div>
        <div class="command-picks">
          <label class="command-check" id="enHasOfficersPick">
            <input type="checkbox" id="enHasOfficers">
            <span class="command-check-icon" aria-hidden="true">✓</span>
            رئاسة ضابط
          </label>
          <label class="command-check" id="enHasPersonnelPick">
            <input type="checkbox" id="enHasPersonnel">
            <span class="command-check-icon" aria-hidden="true">✓</span>
            رئاسة فرد
          </label>
        </div>
        <div class="grid">
          <label id="enOfficersWrap" class="hidden">الضباط <small>واحد أو أكتر</small>
            <select id="enOfficers" multiple size="4"></select>
          </label>
          <label id="enPersonnelWrap" class="hidden">الأفراد <small>واحد أو أكتر</small>
            <select id="enPersonnel" multiple size="4"></select>
          </label>
        </div>
        <div class="field-legend" style="margin-top:10px">المجندين</div>
        <div id="conRows" class="req-rows"></div>
        <button type="button" class="mini" id="addConRow">＋ إضافة فئة</button>
        <label style="margin-top:10px">عدد المجندين
          <small>لأي خدمة غير الأساسية (طارئة أو قسم مخصّص) — بيظهر في صفحة اعداد الخدمات تلقائيًا</small>
          <input id="enConCount" type="number" min="0">
        </label>
      </div>

      <div class="field-section">
        <div class="field-legend">تفاصيل الخدمة</div>
        <div class="grid">
          <label>التسليح <small>آلي / دونك / خرطوش / فض / فيدرال / كلبش</small>
            <input id="enWeapon">
          </label>
          <label>الانتظام <small>8ص / 8م / 11ص حتى الانتهاء</small>
            <input id="enTime">
          </label>
          <label>الجهة <small>عتاقة / الجناين / فيصل / الاربعين</small>
            <input id="enParty">
          </label>
        </div>
      </div>

      <label>ملاحظات
        <input id="enNote">
      </label>
      <div class="actions" style="margin-top:10px">
        <button class="primary full" type="submit">حفظ</button>
        <span class="shortcut-save-hint"><kbd>Ctrl</kbd> + <kbd>Enter</kbd> للحفظ</span>
      </div>
      <p class="muted" style="margin:8px 0 0">
        الحفظ بيكتب في اليومية على طول — عشان يتسجّل في سجل التغييرات
        اضغط «✔ تأكيد اليومية» فوق بعد ما تخلّص كل التعديلات.
      </p>
    </form>
  </div>
</div>
