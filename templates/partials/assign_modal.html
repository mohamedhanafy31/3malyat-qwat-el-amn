<!-- ============ تكليف ضابط بخدمة ============ -->
<div class="modal hidden" id="assignModal">
  <div class="modal-card">
    <button class="close" data-close="assignModal">×</button>
    <h2 id="assignTitle">حالة الضابط</h2>
    <p class="hint" id="assignHint"></p>
    <div class="assign-rest hidden" id="assignRest">
      <span id="assignRestText"></span>
      <button type="button" class="mini bad" id="assignStopRest">إيقاف الراحة</button>
    </div>
    <form id="assignForm">
      <input type="hidden" id="assignPerson">
      <div class="grid">
        <label>حالة خاصة <small>خانتها في جدول الإجمالي</small>
          <select id="assignStatus"></select>
        </label>
        <label class="checkline">
          <input type="checkbox" id="assignTaq"> تقصيرة (خرج بدري بعد خدمته)
        </label>
      </div>
      <label>ملاحظات
        <input id="assignNote" placeholder="نص التشغيل كما هو في اليومية">
      </label>
      <button class="primary full" type="submit">حفظ الحالة</button>
    </form>
  </div>
</div>
