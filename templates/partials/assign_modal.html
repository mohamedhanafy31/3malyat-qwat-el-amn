<!-- ============ تكليف ضابط بخدمة ============ -->
<div class="modal hidden" id="assignModal">
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="assignTitle">
    <button type="button" class="close" data-close="assignModal" aria-label="إغلاق">×</button>
    <h2 id="assignTitle">حالة الضابط</h2>
    <p class="hint" id="assignHint"></p>
    <div class="assign-state-card leave-state hidden" id="assignRest">
      <span class="assign-state-icon" aria-hidden="true">{{ icon('calendar') }}</span>
      <span class="assign-state-copy"><strong>راحة مسجلة</strong><span id="assignRestText"></span></span>
      <button type="button" class="mini bad" id="assignStopRest">إنهاء الراحة</button>
    </div>
    <div class="assign-state-card persistent-status hidden" id="assignPersistent">
      <span class="assign-state-icon" aria-hidden="true">{{ icon('clock') }}</span>
      <span class="assign-state-copy"><strong id="assignPersistentTitle">حالة مستمرة</strong><span id="assignPersistentText"></span></span>
      <button type="button" class="mini bad" id="assignStopPersistent">إنهاء الحالة من هذا اليوم</button>
      <button type="button" class="mini bad" id="assignCancelPersistent">إلغاء تسجيل الحالة بالكامل</button>
    </div>
    <form id="assignForm" novalidate>
      <input type="hidden" id="assignPerson">
      <div class="grid">
        <label>حالة خاصة <small>اختر تصنيفًا موجودًا أو اكتب تصنيفًا جديدًا؛ يظهر في جدول الإجمالي ويُحفظ للمرات القادمة</small>
          <select id="assignStatus" data-combo-custom data-combo-custom-label="تصنيف جديد"
                  data-maxlength="60" aria-label="تصنيف حالة الضابط"></select>
          <small class="status-behavior-hint" id="assignStatusHint">مرضي وغياب تستمر حتى إنهائها؛ طارئة ومأمورية وانتداب حتى يوم محدد.</small>
        </label>
        <label class="hidden" id="assignEndRow">حتى يوم <small>آخر يوم في الحالة (شامل) — تنتهي تلقائيًا بعده</small>
          <input type="date" id="assignStatusEnd">
        </label>
        <label class="hidden" id="assignTitleRow">اسم المأمورية / الانتداب
          <input id="assignStatusTitle" maxlength="120" placeholder="مثال: تأمين مؤتمر">
        </label>
        <label class="hidden" id="assignDetailsRow">التفاصيل <small>تظهر في اليومية في كل يوم من أيام الحالة</small>
          <input id="assignStatusDetails" maxlength="300" placeholder="مثال: بمدينة العاشر من رمضان">
        </label>
        <label class="checkline">
          <input type="checkbox" id="assignTaq"> تقصيرة (خرج بدري بعد خدمته)
        </label>
      </div>
      <label>تشغيل إضافي <small>يُضاف بعد خدمته التلقائية من اليومية التفصيلية</small>
        <input id="assignExtra" maxlength="500" placeholder="مثال: متابعة اعمال التعيينات">
      </label>
      <label class="hidden" id="assignNoteRow">نص التشغيل الكامل المحفوظ <small>نص قديم بيحل محل الخدمة التلقائية — امسحه لو عايز الخدمة تظهر لوحدها</small>
        <input id="assignNote" maxlength="500">
      </label>
      <label class="checkline">
        <input type="checkbox" id="assignAdmin">
        <span>إضافة للعمل بالإدارة
          <small id="assignAdminHint" class="block-hint">النص التشغيلي الكامل (خدمته + الإضافي) يظهر كمان في «عمل بالإدارة» في اليومية التفصيلية، ويفضل في مكان خدمته</small></span>
      </label>
      <p class="hint" id="assignPreview"></p>
      <div class="actions modal-foot">
        <button class="primary full" type="submit">حفظ الحالة</button>
        <button type="button" class="btn" data-close="assignModal">إلغاء</button>
      </div>
    </form>
  </div>
</div>
