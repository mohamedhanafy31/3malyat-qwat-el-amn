<div class="modal hidden" id="campaignAttachModal">
  <div class="modal-card small campaign-combo-modal" role="dialog" aria-modal="true" aria-labelledby="campaignAttachTitle">
    <button type="button" class="close" data-close="campaignAttachModal" aria-label="إغلاق">×</button>
    <h2 id="campaignAttachTitle">إضافة خدمة إلى اللوري</h2>
    <form id="campaignAttachForm" novalidate>
      <input type="hidden" id="campaignAttachLorry">
      <label>الخدمة
        <select id="campaignAttachSelect" data-combo-custom data-maxlength="200" aria-label="الخدمة المراد إلحاقها"></select>
      </label>
      <div class="actions modal-foot"><button class="primary" type="submit">إضافة</button><button type="button" class="btn" data-close="campaignAttachModal">إلغاء</button></div>
    </form>
  </div>
</div>

<div class="modal hidden" id="campaignPostModal">
  <div class="modal-card small" role="dialog" aria-modal="true" aria-labelledby="campaignPostTitle">
    <button type="button" class="close" data-close="campaignPostModal" aria-label="إغلاق">×</button>
    <h2 id="campaignPostTitle">إضافة ارتكاز</h2>
    <form id="campaignPostForm" novalidate>
      <input type="hidden" id="campaignPostId">
      <label>اسم الارتكاز<input id="campaignPostName" maxlength="200" autocomplete="off" required></label>
      <label>الرقم (اختياري)<input id="campaignPostNumber" maxlength="20" autocomplete="off" placeholder="مثال: 6."></label>
      <label id="campaignPostDriverField">السائق الافتراضي (اختياري)<input id="campaignPostDriver" maxlength="200" autocomplete="off"></label>
      <div class="actions modal-foot"><button class="primary" id="campaignPostSubmit" type="submit">إضافة</button><button type="button" class="btn" data-close="campaignPostModal">إلغاء</button></div>
    </form>
  </div>
</div>

<div class="modal hidden" id="campaignDailyModal">
  <div class="modal-card small" role="dialog" aria-modal="true" aria-labelledby="campaignDailyTitle">
    <button type="button" class="close" data-close="campaignDailyModal" aria-label="إغلاق">×</button>
    <h2 id="campaignDailyTitle">إضافة قول يومي</h2>
    <form id="campaignDailyForm" novalidate>
      <label>اسم القول
        <input id="campaignDailyName" maxlength="200" autocomplete="off" required>
      </label>
      <label>ربط خدمة أساسية (اختياري)
        <select id="campaignDailyBasic"><option value="">بدون ربط</option></select>
      </label>
      <div class="actions modal-foot"><button class="primary" type="submit">إضافة</button><button type="button" class="btn" data-close="campaignDailyModal">إلغاء</button></div>
    </form>
  </div>
</div>
