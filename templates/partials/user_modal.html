<!-- ============ نافذة إضافة حساب جديد ============ -->
<div class="modal hidden" id="userCreateModal">
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="userCreateModalTitle">
    <button type="button" class="close" data-close="userCreateModal" aria-label="إغلاق">×</button>
    <h2 id="userCreateModalTitle">إضافة حساب جديد</h2>
    <div id="userCreateError" class="alert-banner alert-banner-danger hidden" role="alert"></div>
    <form id="userCreateForm" novalidate>
      <p class="form-note">الحقول المعلّمة بـ <span class="req" aria-hidden="true">*</span> مطلوبة</p>
      
      <div class="auth-field">
        <label for="createUsername"><span class="label-text">اسم المستخدم <span class="req" aria-hidden="true">*</span></span></label>
        <input id="createUsername" name="username" class="auth-input" required autocomplete="off" placeholder="مثال: officer_ahmed">
        <p class="field-hint">٣ إلى ٣٢ حرفًا إنجليزيًا وأرقام ورموز (._-)</p>
      </div>

      <div class="auth-field">
        <label for="createDisplayName"><span class="label-text">الاسم الظاهر <span class="req" aria-hidden="true">*</span></span></label>
        <input id="createDisplayName" name="display_name" class="auth-input" required placeholder="مثال: نقيب / أحمد محمود">
      </div>

      <div class="auth-field">
        <label for="createRole"><span class="label-text">نوع الحساب والصلاحية <span class="req" aria-hidden="true">*</span></span></label>
        <select id="createRole" name="role" class="select full" required>
          <option value="officer" selected>ضابط</option>
          <option value="individual">فرد</option>
          <option value="conscript">مجند</option>
          <option value="admin">ادمن (مدير نظام)</option>
        </select>
      </div>

      <div class="auth-field">
        <label for="createPassword"><span class="label-text">كلمة المرور <span class="req" aria-hidden="true">*</span></span></label>
        <div class="input-wrap password-wrap">
          <input type="password" id="createPassword" name="password" class="auth-input" required minlength="8" placeholder="٨ أحرف على الأقل">
          <button type="button" class="btn-toggle-pwd" data-toggle-password="createPassword" aria-label="إظهار كلمة المرور" aria-pressed="false" tabindex="-1">
            <svg class="icon-eye" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
            <svg class="icon-eye-off hidden" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.44-4.75-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10.02 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2zm4.31-.78l3.15 3.15.02-.16c0-1.66-1.34-3-3-3l-.17.01z"/></svg>
          </button>
        </div>
        <p class="field-hint">يجب ألا تقل عن ٨ أحرف</p>
      </div>

      <div class="actions modal-foot">
        <button class="primary" type="submit" id="createSubmitBtn">إنشاء الحساب</button>
        <button type="button" class="btn" data-close="userCreateModal">إلغاء</button>
      </div>
    </form>
  </div>
</div>

<!-- ============ نافذة تعديل بيانات الحساب ============ -->
<div class="modal hidden" id="userEditModal">
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="userEditModalTitle">
    <button type="button" class="close" data-close="userEditModal" aria-label="إغلاق">×</button>
    <h2 id="userEditModalTitle">تعديل بيانات الحساب</h2>
    <div id="userEditError" class="alert-banner alert-banner-danger hidden" role="alert"></div>
    <form id="userEditForm" novalidate>
      <input type="hidden" id="editUserId">

      <div class="auth-field">
        <label for="editUsername"><span class="label-text">اسم المستخدم <span class="req" aria-hidden="true">*</span></span></label>
        <input id="editUsername" name="username" class="auth-input" required autocomplete="off" placeholder="مثال: officer_ahmed">
        <p class="field-hint">٣ إلى ٣٢ حرفًا إنجليزيًا وأرقام ورموز (._-)</p>
      </div>

      <div class="auth-field">
        <label for="editDisplayName"><span class="label-text">الاسم الظاهر <span class="req" aria-hidden="true">*</span></span></label>
        <input id="editDisplayName" name="display_name" class="auth-input" required placeholder="مثال: نقيب / أحمد محمود">
      </div>

      <div class="auth-field">
        <label for="editRole"><span class="label-text">نوع الحساب والصلاحية <span class="req" aria-hidden="true">*</span></span></label>
        <select id="editRole" name="role" class="select full" required>
          <option value="officer">ضابط</option>
          <option value="individual">فرد</option>
          <option value="conscript">مجند</option>
          <option value="admin">ادمن (مدير نظام)</option>
        </select>
      </div>

      <div class="auth-field">
        <label for="editPassword"><span class="label-text">كلمة مرور جديدة (اتركها فارغة بدون تغيير)</span></label>
        <div class="input-wrap password-wrap">
          <input type="password" id="editPassword" name="password" class="auth-input" minlength="8" placeholder="اتركها فارغة بدون تغيير" autocomplete="new-password">
          <button type="button" class="btn-toggle-pwd" data-toggle-password="editPassword" aria-label="إظهار كلمة المرور" aria-pressed="false" tabindex="-1">
            <svg class="icon-eye" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
            <svg class="icon-eye-off hidden" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.44-4.75-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10.02 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2zm4.31-.78l3.15 3.15.02-.16c0-1.66-1.34-3-3-3l-.17.01z"/></svg>
          </button>
        </div>
        <p class="field-hint">في حال الرغبة في التغيير: يجب ألا تقل عن ٨ أحرف</p>
      </div>

      <div class="actions modal-foot">
        <button class="primary" type="submit" id="editSubmitBtn">حفظ التعديلات</button>
        <button type="button" class="btn" data-close="userEditModal">إلغاء</button>
      </div>
    </form>
  </div>
</div>

<!-- ============ نافذة إعادة تعيين كلمة المرور ============ -->
<div class="modal hidden" id="userResetPasswordModal">
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="userResetPasswordModalTitle">
    <button type="button" class="close" data-close="userResetPasswordModal" aria-label="إغلاق">×</button>
    <h2 id="userResetPasswordModalTitle">إعادة تعيين كلمة المرور</h2>
    <div id="userResetError" class="alert-banner alert-banner-danger hidden" role="alert"></div>
    <form id="userResetPasswordForm" novalidate>
      <input type="hidden" id="resetUserId">
      <div id="resetUserInfo" class="user-reset-info panel-notice"></div>

      <div class="auth-field">
        <label for="resetNewPassword"><span class="label-text">كلمة المرور الجديدة <span class="req" aria-hidden="true">*</span></span></label>
        <div class="input-wrap password-wrap">
          <input type="password" id="resetNewPassword" name="password" class="auth-input" required minlength="8" placeholder="٨ أحرف على الأقل">
          <button type="button" class="btn-toggle-pwd" data-toggle-password="resetNewPassword" aria-label="إظهار كلمة المرور" aria-pressed="false" tabindex="-1">
            <svg class="icon-eye" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
            <svg class="icon-eye-off hidden" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.44-4.75-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10.02 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2zm4.31-.78l3.15 3.15.02-.16c0-1.66-1.34-3-3-3l-.17.01z"/></svg>
          </button>
        </div>
        <p class="field-hint">يجب ألا تقل عن ٨ أحرف</p>
      </div>

      <div class="actions modal-foot">
        <button class="primary" type="submit" id="resetSubmitBtn">تعيين كلمة المرور</button>
        <button type="button" class="btn" data-close="userResetPasswordModal">إلغاء</button>
      </div>
    </form>
  </div>
</div>
