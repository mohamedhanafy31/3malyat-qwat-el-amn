<!-- ============ إخراج من القوة ============ -->
<div class="modal hidden" id="removeModal">
  <div class="modal-card small" role="dialog" aria-modal="true" aria-labelledby="removeModalTitle">
    <button type="button" class="close" data-close="removeModal" aria-label="إغلاق">×</button>
    <h2 id="removeModalTitle">إخراج من القوة</h2>
    <p id="removeName"></p>
    <form id="removeForm" novalidate>
      <input type="hidden" id="removeId">
      <label><span class="label-text">تاريخ الخروج <span class="req" aria-hidden="true">*</span></span>
        <input type="date" id="leaveDate" required>
      </label>
      <label>سبب الخروج
        <textarea id="reason" rows="3" placeholder="مثال: نقل، إنهاء خدمة..."></textarea>
      </label>
      <div class="actions modal-foot">
        <button class="danger full" type="submit">إخراج وحفظ في الأرشيف</button>
        <button type="button" class="btn" data-close="removeModal">إلغاء</button>
      </div>
    </form>
  </div>
</div>
