<!-- ============ فرقة ============ -->
<div class="modal hidden" id="courseModal">
  <div class="modal-card small" role="dialog" aria-modal="true" aria-labelledby="courseTitle">
    <button type="button" class="close" data-close="courseModal" aria-label="إغلاق">×</button>
    <h2 id="courseTitle">فرقة جديدة</h2>
    <form id="courseForm" novalidate>
      <input type="hidden" id="crsId">
      <label><span class="label-text">اسم الفرقة <span class="req" aria-hidden="true">*</span></span>
        <input id="crsName" required placeholder="فرقة الحراسات المشددة">
      </label>
      <div class="grid">
        <label>النوع
          <select id="crsKind"></select>
        </label>
        <label>المكان <small>الجهة التي تُعقد فيها</small>
          <input id="crsPlace" placeholder="مدرسة الدفاع الشعبي والعسكري">
        </label>
      </div>
      <label>ملاحظات
        <input id="crsNote">
      </label>
      <div class="actions modal-foot">
        <button class="primary full" type="submit">حفظ</button>
        <button type="button" class="btn" data-close="courseModal">إلغاء</button>
      </div>
    </form>
  </div>
</div>
