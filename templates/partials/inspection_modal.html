<!-- ============ تفتيش في الجدول الأسبوعي (نظام التفتيشات) ============ -->
<div class="modal hidden" id="inspectionModal">
  <div class="modal-card small" role="dialog" aria-modal="true" aria-labelledby="inspectionModalTitle">
    <button type="button" class="close" data-close="inspectionModal" aria-label="إغلاق">×</button>
    <h2 id="inspectionModalTitle">تفتيش جديد</h2>
    <p class="hint" id="inspectionModalDay"></p>
    <form id="inspectionForm" novalidate>
      <input type="hidden" id="inspWeekday">
      <input type="hidden" id="inspId">
      <label><span class="label-text">اسم التفتيش <span class="req" aria-hidden="true">*</span></span> <small>تفتيش + اسم السجن، مثال: تفتيش فيصل</small>
        <input id="inspName" required placeholder="تفتيش…">
      </label>
      <label>التسليح
        <input id="inspWeapon">
      </label>
      <label>عدد المجندين
        <input id="inspCount" type="number" min="0">
      </label>
      <div class="actions modal-foot">
        <button class="primary full" type="submit">حفظ</button>
        <button type="button" class="btn" data-close="inspectionModal">إلغاء</button>
      </div>
    </form>
  </div>
</div>
