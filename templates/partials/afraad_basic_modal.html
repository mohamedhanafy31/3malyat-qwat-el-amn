<div class="modal hidden" id="afBasicModal">
  <div class="modal-card small" role="dialog" aria-modal="true" aria-labelledby="afBasicTitle">
    <button type="button" class="close" data-close="afBasicModal" aria-label="إغلاق">×</button>
    <h2 id="afBasicTitle">تعديل الخدمات الأساسية</h2>
    <p class="muted" id="afBasicEffective"></p>
    <div id="afBasicList"></div>
    <form id="afBasicForm" class="actions" novalidate>
      <input id="afBasicName" maxlength="120" autocomplete="off" placeholder="اسم الخدمة" required>
      <button class="primary" type="submit">إضافة</button>
    </form>
    <div class="actions modal-foot">
      <button type="button" class="primary" data-close="afBasicModal">تم</button>
    </div>
  </div>
</div>
