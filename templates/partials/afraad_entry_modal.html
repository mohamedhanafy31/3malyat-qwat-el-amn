<!-- ============ القائم بها/التليفون/الانتظام على خدمة أساسية ============ -->
<div class="modal hidden" id="afEntryModal">
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="afEntryTitle">
    <button type="button" class="close" data-close="afEntryModal" aria-label="إغلاق">×</button>
    <h2 id="afEntryTitle">تعديل الخدمة</h2>
    <form id="afEntryForm" novalidate>
      <input type="hidden" id="afEntryId">
      <input type="hidden" id="afMorningPersonId">
      <input type="hidden" id="afNightPersonId">
      <datalist id="afPersonnelList"></datalist>
      <div class="grid">
        <label>القائم بها صباحًا
          <input id="afMorningName" list="afPersonnelList" autocomplete="off">
        </label>
        <label>هاتف الصباحية
          <input id="afMorningPhone">
        </label>
        <label>القائم بها ليلًا
          <input id="afNightName" list="afPersonnelList" autocomplete="off">
        </label>
        <label>هاتف الليلية
          <input id="afNightPhone">
        </label>
        <label>قوام الخدمة <small>مثال: 1 مجند صباحًا + 1 سائق</small>
          <input id="afCount">
        </label>
        <label>التسليح <small>مثال: آلي + كلبش</small>
          <input id="afWeapon">
        </label>
        <label>موعد الانتظام <small>مثال: 8ص / 8م</small>
          <input id="afSchedule">
        </label>
      </div>
      <div class="actions modal-foot">
        <button class="primary full" type="submit">حفظ</button>
        <button type="button" class="btn" data-close="afEntryModal">إلغاء</button>
      </div>
    </form>
  </div>
</div>
