<!-- ============ إضافة / تعديل شخص ============ -->
<div class="modal hidden" id="personModal">
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="personModalTitle">
    <button type="button" class="close" data-close="personModal" aria-label="إغلاق">×</button>
    <h2 id="personModalTitle">إضافة إلى القوة</h2>
    <form id="personForm" novalidate>
      <input type="hidden" id="personId">
      <p class="form-note">الحقول المعلّمة بـ <span class="req" aria-hidden="true">*</span> مطلوبة</p>
      <div class="grid">
        <label>الفئة
          <select name="type" id="type">
            <option value="officer">ضابط</option>
            <option value="personnel">فرد</option>
          </select>
        </label>
        <label>الرتبة / الدرجة
          <select name="role" id="role"></select>
        </label>
        <label><span class="label-text">الاسم <span class="req" aria-hidden="true">*</span></span>
          <input name="name" id="fName" required>
        </label>
        <label><span class="label-text">رقم الأقدمية (الكود) <span class="req" aria-hidden="true">*</span></span>
          <input name="code" id="fCode" required>
        </label>
        <label>رقم الهاتف
          <input name="phone" id="fPhone" inputmode="tel">
        </label>
        <label><span class="label-text">تاريخ الانضمام <span class="req" aria-hidden="true">*</span></span>
          <input type="date" name="join_date" id="fJoin" required>
        </label>
        <label id="postWrap">العمل المسند
          <input name="post" id="fPost">
        </label>
        <label id="addressWrap" class="hidden">العنوان
          <input name="address" id="fAddress">
        </label>
        <label id="weaponWrap">عهدة السلاح <small>رقم السلاح، أو «منع سلاح»</small>
          <input name="weapon_custody" id="fWeaponCustody">
        </label>
        <label id="restSysWrap">نظام الراحة
          <select name="rest_system" id="fRestSystem"></select>
        </label>
        <label id="restDayWrap">يوم الراحة الأسبوعية
          <select name="rest_day" id="fRestDay"></select>
        </label>
      </div>
      <div id="archiveFields" class="hidden">
        <div class="grid">
          <label>تاريخ الخروج
            <input type="date" name="leave_date" id="fLeaveDate">
          </label>
          <label>سبب الخروج
            <input name="leave_reason" id="fLeaveReason">
          </label>
        </div>
      </div>
      <div class="actions modal-foot">
        <button class="primary full" type="submit" id="personSubmit">حفظ</button>
        <button type="button" class="btn" data-close="personModal">إلغاء</button>
      </div>
    </form>
  </div>
</div>
