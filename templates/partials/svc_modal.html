<!-- ============ خدمة في الكتالوج ============ -->
<div class="modal hidden" id="svcModal">
  <div class="modal-card small">
    <button class="close" data-close="svcModal">×</button>
    <h2 id="svcTitle">خدمة جديدة</h2>
    <form id="svcForm">
      <input type="hidden" id="svcId">
      <label>اسم الخدمة
        <input id="svcName" required>
      </label>
      <label>التصنيف
        <select id="svcKind"></select>
      </label>
      <button class="primary full" type="submit">حفظ</button>
    </form>
  </div>
</div>
