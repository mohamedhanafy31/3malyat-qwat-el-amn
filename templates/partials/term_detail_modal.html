<!-- ============ تفاصيل التحاق ضابط بفرقة ============ -->
<div class="modal hidden" id="termDetailModal">
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="tdTitle">
    <button type="button" class="close" data-close="termDetailModal" aria-label="إغلاق">×</button>
    <h2 id="tdTitle">تفاصيل الفرقة</h2>
    <p class="hint" id="tdWho"></p>
    <div id="tdBody"></div>
    <div class="actions" style="margin-top:12px">
      <button class="mini" id="tdEdit">تعديل الالتحاق</button>
      <button class="mini bad" id="tdDelete">حذف الالتحاق</button>
    </div>
  </div>
</div>
