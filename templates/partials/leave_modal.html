<!-- ============ تسجيل / تعديل راحة ============ -->
<div class="modal hidden" id="leaveModal">
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="leaveModalTitle">
    <button type="button" class="close" data-close="leaveModal" aria-label="إغلاق">×</button>
    <h2 id="leaveModalTitle">تسجيل راحة</h2>
    <form id="leaveForm" novalidate>
      <input type="hidden" id="leaveId">
      <div class="grid">
        <label>الشخص
          <select name="person_id" id="lvPerson"></select>
        </label>
        <label>نوع الراحة
          <select name="type" id="lvType"></select>
        </label>
        <label><span class="label-text">من تاريخ <span class="req" aria-hidden="true">*</span></span>
          <input type="date" name="start" id="lvStart" required>
        </label>
        <label><span class="label-text">إلى تاريخ <span class="req" aria-hidden="true">*</span></span> <span class="muted">(آخر يوم راحة)</span>
          <input type="date" name="end" id="lvEnd" required>
        </label>
      </div>
      <p class="hint" id="lvHint"></p>
      <label>ملاحظات
        <input name="note" id="lvNote">
      </label>
      <div class="actions modal-foot">
        <button class="primary full" type="submit">حفظ الراحة</button>
        <button type="button" class="btn" data-close="leaveModal">إلغاء</button>
      </div>
    </form>
  </div>
</div>
